name: Daily ad news check

on:
  schedule:
    # 毎日 7:47 JST（22:47 UTC）。毎時 0 分は GitHub Actions が混雑するためずらしている
    - cron: "47 22 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Slack に送らず結果だけ表示する"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: adbot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run bot
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            python -m adbot.main --dry-run
          else
            python -m adbot.main
          fi

      # 評価済み記事・通知済みトピックを保存（重複通知を防ぐため）
      - name: Commit state
        if: ${{ inputs.dry_run != true }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/state.json
          if git diff --cached --quiet; then
            echo "state unchanged"
          else
            git commit -m "chore: update bot state [skip ci]"
            git push
          fi
